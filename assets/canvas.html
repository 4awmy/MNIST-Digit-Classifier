<div class="drawing-card">
  <div class="canvas-heading"><span>YOUR HANDWRITING</span><span class="live-dot">ONE DIGIT</span></div>
  <canvas width="280" height="280" aria-label="Draw one digit from zero to nine" tabindex="0"></canvas>
  <p class="drawing-hint">Draw a large digit with your mouse or finger.</p>
  <div class="canvas-actions">
    <button class="clear" type="button">Clear</button>
    <button class="predict" type="button">Predict <span aria-hidden="true">↗</span></button>
  </div>
</div>
